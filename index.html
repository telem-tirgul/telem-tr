var enc=new TextEncoder();
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a;}
function b64(a){var s='';for(var k=0;k<a.length;k++)s+=String.fromCharCode(a[k]);return btoa(s);}
async function open(key){
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(user,pass){
  var base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
var err=document.getElementById('err'),btn=document.getElementById('b');
if(!window.crypto||!crypto.subtle){err.textContent='הדפדפן לא תומך. יש לפתוח דרך כתובת https.';}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';btn.disabled=true;
  try{
    var key=await derive(document.getElementById('u').value,document.getElementById('p').value);
    var raw=b64(new Uint8Array(await crypto.subtle.exportKey('raw',key)));
    try{await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));}
    catch(x){err.textContent='שם משתמש או סיסמה שגויים';btn.disabled=false;return;}
    try{sessionStorage.setItem('telem_k',JSON.stringify({k:raw,t:Date.now()}));}catch(_){}
    await open(key);
  }catch(x){err.textContent='שגיאה. נסו שוב.';btn.disabled=false;}
});
window.addEventListener('load',function(){setTimeout(async function(){
  try{
    try{localStorage.removeItem('telem_k');}catch(_){}  // נועה 1.11: לא נשמר יותר לאורך זמן
    var o=JSON.parse(sessionStorage.getItem('telem_k')||'null'); if(!o||!o.k||!crypto.subtle)return;
    if(Date.now()-o.t>14*864e5){sessionStorage.removeItem('telem_k');return;}  // עד סגירת הדפדפן או 14 יום
    var raw=o.k;
    var key=await crypto.subtle.importKey('raw',u8(raw),'AES-GCM',false,['decrypt']);
    await open(key);
  }catch(_){try{sessionStorage.removeItem('telem_k');}catch(__){}}
},0);});
})();
